[project]
name = "tyrant"
version = "0.4.0"
description = "Secret Hitler board game implementation"
readme = "README.md"
authors = [
    { name = "Pramod Anandarao" }
]
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["secret-hitler", "board-game", "llm", "game-engine", "social-deduction"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Board Games",
    "Typing :: Typed",
]
dependencies = [
    "frozendict>=2.4.7",
]

[project.urls]
Homepage = "https://github.com/7673502/tyrant"
Documentation = "https://docs.secretarena.org"
Repository = "https://github.com/7673502/tyrant"
Issues = "https://github.com/7673502/tyrant/issues"

[project.optional-dependencies]
llm = [
    "litellm>=1.91.0",
]

[build-system]
requires = ["uv_build>=0.8.6,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.15.18",
]
docs = [
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.7",
]

