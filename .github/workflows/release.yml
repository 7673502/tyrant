name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv run python -m unittest
      - run: uv build
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/tyrant/
    steps:
      - uses: astral-sh/setup-uv@v10.3.0
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist
      - run: uv publish
